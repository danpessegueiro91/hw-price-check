name: Deploy HW Price Check to Cloudflare Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate site assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check inline JavaScript and PWA manifest
        run: python scripts/check-inline-js.py

  browser-test:
    needs: validate
    name: Browser functional tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
      - name: Run browser functional tests
        run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, browser-test]
    name: Publish to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pages project if it does not exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "290ebea135897d3733df7a3a9afede94"
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi

          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")"

          if echo "$response" | jq -e '.result[]? | select(.name == "hwpricecheck")' >/dev/null; then
            echo "Cloudflare Pages project hwpricecheck already exists."
          else
            echo "Creating Cloudflare Pages project hwpricecheck..."
            npx --yes wrangler@latest pages project create hwpricecheck --production-branch main
          fi

      - name: Confirm deployment target
        run: |
          echo "Deploying commit $GITHUB_SHA to Cloudflare Pages project hwpricecheck"
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo '::error::Missing CLOUDFLARE_API_TOKEN secret'; exit 1; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "290ebea135897d3733df7a3a9afede94"
          command: pages deploy . --project-name=hwpricecheck --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test all published catalog photos
        shell: bash
        run: |
          set -euo pipefail
          base="https://hwpricecheck.pages.dev/assets/catalog"
          while IFS='|' read -r path expected; do
            headers="$(mktemp)"
            code="$(curl --silent --show-error --location --output /dev/null --dump-header "$headers" --write-out '%{http_code}' "$base/$path")"
            type="$(grep -i '^content-type:' "$headers" | tail -1 | tr -d '\r' | awk '{print $2}')"
            rm -f "$headers"
            if [ "$code" != "200" ] || [[ "$type" != image/jpeg* ]]; then
              echo "::error::Live photo failed: $path (HTTP $code, $type)"
              exit 1
            fi
            echo "LIVE OK $path"
          done <<'PHOTOS'
          2026/sth/23-ram-1500.jpg|61532
          2026/sth/64-impala.jpg|56831
          2026/sth/67-pontiac-firebird-400.jpg|52495
          2026/sth/70-plymouth-aar-cuda.jpg|58155
          2026/sth/87-ford-sierra-cosworth.jpg|51342
          2026/sth/94-toyota-supra-tooned.jpg|64373
          2026/sth/custom-otto.jpg|51758
          2026/sth/drift-ender.jpg|55734
          2026/sth/ferrari-f40-competizione.jpg|45446
          2026/sth/ford-mustang-gtd.jpg|3872537
          2026/sth/honda-civic-custom.jpg|31168
          2026/sth/lotus-sport-elise.jpg|61961
          2026/sth/nissan-maxima-drift-car.jpg|57499
          2026/sth/porsche-911-carrera-rs-2-7.jpg|57730
          2026/sth/subaru-impreza.jpg|55247
          2026/th/2-jet-z.jpg|46382
          2026/th/2016-ford-gt-race.jpg|50762
          2026/th/87-buick-regal-gnx.jpg|255677
          2026/th/92-dodge-viper-rt-10.jpg|48781
          2026/th/amaru-gtc.jpg|45551
          2026/th/cone-shaker.jpg|50299
          2026/th/electro-silhouette.jpg|45174
          2026/th/fast-fish.jpg|64742
          2026/th/ford-model-a-custom-31.jpg|50031
          2026/th/gazella-gt.jpg|64140
          2026/th/hot-wheengs.jpg|49458
          2026/th/mad-manga.jpg|60066
          2026/th/nissan-skyline-ht-2000gt-x.jpg|71328
          2026/th/sweet-driver.jpg|84704
          2026/th/total-disposal.jpg|68665
          PHOTOS

  verify-production:
    needs: deploy
    name: Verify production pages
    runs-on: ubuntu-latest
    steps:
      - name: Verify the public homepage serves the deployed release
        shell: bash
        run: |
          set -euo pipefail
          url="https://hwpricecheck.pages.dev/?release=$GITHUB_SHA"
          html="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --header 'Cache-Control: no-cache' "$url")"
          for expected in 'v1.1.0' '/termos' '/privacidade' '/cookies' '/como-funciona' './metodologia-precos.html' 'mailto:hwpricecheck@gmail.com'; do
            if ! grep -Fq "$expected" <<<"$html"; then
              echo "::error::Production homepage is missing expected release marker: $expected"
              exit 1
            fi
          done
          if grep -Fq 'Comprar Premium' <<<"$html" || grep -Fq 'v1.0.0' <<<"$html"; then
            echo "::error::Production homepage is serving stale or obsolete content"
            exit 1
          fi
          echo "PRODUCTION HOMEPAGE OK: $GITHUB_SHA"

          while IFS='|' read -r path expected; do
            body="$(mktemp)"
            status="$(curl --silent --show-error --location --retry 5 --retry-delay 3 \
              --header 'Cache-Control: no-cache' \
              --output "$body" --write-out '%{http_code}' \
              "https://hwpricecheck.pages.dev/$path?release=$GITHUB_SHA")"
            if [ "$status" != "200" ]; then
              echo "::error::Public route failed: /$path (HTTP $status)"
              cat "$body"
              rm -f "$body"
              exit 1
            fi
            if ! grep -Fq "$expected" "$body"; then
              echo "::error::Public route /$path returned 200 but the expected page content is missing"
              rm -f "$body"
              exit 1
            fi
            rm -f "$body"
            echo "PUBLIC ROUTE OK: /$path"
          done <<'ROUTES'
          privacidade|Política de Privacidade
          termos|Termos de Utilização
          cookies|Cookies e Armazenamento Local
          como-funciona|Como Funciona
          ROUTES
